[project]
name = "datapulse"
version = "0.1.0"
description = "Plataforma de ingeniería de datos: ingesta, validación, orquestación y modelado analítico trazable."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Juan S. Garcia C.", email = "276046067+JuanSGarciaC@users.noreply.github.com" }]
# Las dependencias se añaden por fase: solo se declara lo que el código usa.
dependencies = [
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3.6,<3.4",
    "alembic>=1.20,<2",
    # Tope <0.151 impuesto por Prefect 3.9 (verificado en ejecución, ver ADR-0001).
    "fastapi>=0.139,<0.151",
    "uvicorn>=0.38",
    # httpx2: sucesor de httpx (mismo autor); Starlette 1.10 ya depreca httpx en TestClient.
    "httpx2>=2.16,<3",
    "polars>=2.1,<3",
    "prefect>=3.9,<3.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7",
    "ruff>=0.15",
    "mypy>=1.19",
    "bandit>=1.9",
    "pip-audit>=2.10",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapulse"]

# ---------------------------------------------------------------- calidad de código
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PL", "PT"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S311"]
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pruebas
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not live'"
filterwarnings = ["error"]
markers = [
    "integration: requiere PostgreSQL real (DATAPULSE_TEST_DB_* o valores por defecto)",
    "live: llama a servicios externos reales (DummyJSON); se ejecuta con -m live",
]

[tool.coverage.run]
source = ["datapulse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
