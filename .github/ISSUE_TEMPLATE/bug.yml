name: Error
description: Algo no funciona como se documenta
labels: [bug]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué pasó y qué esperabas
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Comandos exactos y salida (sin secretos ni el contenido de `.env`).
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Sistema operativo, versión de Docker Desktop y de PowerShell
    validations:
      required: true
