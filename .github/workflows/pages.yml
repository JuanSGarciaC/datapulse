name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/img/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # La landing usa ../docs/img/: se publican site/ y docs/img/ con la misma estructura.
      - name: Preparar el sitio
        run: |
          mkdir -p _site/docs
          cp -r site _site/site
          cp -r docs/img _site/docs/img
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=site/"><a href="site/">DataPulse</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
