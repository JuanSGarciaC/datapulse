name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # semanal: detecta cambios en la API pública aunque no haya commits

# Acciones fijadas por SHA (inmutables): una etiqueta puede moverse, un commit no.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.33"
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Lint y tipos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Formato
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check . --output-format github
      - name: Tipos (mypy estricto)
        run: uv run mypy

  tests:
    name: Pruebas (unitarias + integración con PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datapulse_admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: datapulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datapulse_admin"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"  # las pruebas de integración fallan (no se omiten) si no hay base de datos
      DATAPULSE_TEST_DB_HOST: localhost
      DATAPULSE_TEST_DB_PORT: "5432"
      DATAPULSE_TEST_DB_NAME: datapulse_test
      DATAPULSE_TEST_DB_USER: datapulse_admin
      DATAPULSE_TEST_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Pruebas con cobertura
        run: uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: Sin deriva entre código y migraciones
        env:
          DATAPULSE_DB_HOST: localhost
          DATAPULSE_DB_NAME: datapulse_test
          DATAPULSE_DB_PASSWORD: ci-only-password
        run: uv run alembic upgrade head && uv run alembic check

  security:
    name: Seguridad
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks revisa todo el historial, no solo el último commit
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Análisis estático (bandit)
        run: uv run bandit -c pyproject.toml -r src
      - name: Vulnerabilidades en dependencias (pip-audit)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --progress-spinner off
      - name: Secretos en el historial (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract:
    name: Contrato contra DummyJSON real
    # Detecta si la API pública cambia y la simulación deja de ser fiel. No bloquea el
    # job de Docker: un corte de un tercero no debe impedir validar nuestro código.
    runs-on: ubuntu-24.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Misma suite de contrato contra la API real
        run: uv run pytest tests/contract -m live -v

  docker:
    name: Docker (build + compose real)
    runs-on: ubuntu-24.04
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Generar .env efímero con contraseñas aleatorias
        run: |
          cp .env.example .env
          for var in DATAPULSE_DB_PASSWORD DATAPULSE_PIPELINE_DB_PASSWORD DATAPULSE_DBT_DB_PASSWORD DATAPULSE_API_DB_PASSWORD DATAPULSE_MOCK_ADMIN_TOKEN DATAPULSE_API_ADMIN_KEY; do
            sed -i "s|^${var}=.*|${var}=$(openssl rand -hex 16)|" .env
          done
          # Una clave por consumidor: la de las pruebas y la del dashboard, ambas válidas en la API.
          ci_key=$(openssl rand -hex 16); dash_key=$(openssl rand -hex 16)
          sed -i "s|^DATAPULSE_API_KEYS=.*|DATAPULSE_API_KEYS=${ci_key},${dash_key}|" .env
          sed -i "s|^DATAPULSE_DASHBOARD_API_KEY=.*|DATAPULSE_DASHBOARD_API_KEY=${dash_key}|" .env
          echo "CI_API_KEY=${ci_key}" >> .env
      - name: Validar docker-compose.yml
        run: docker compose config -q
      - name: Construir imagen
        run: docker compose build
      - name: Levantar base y aplicar migraciones dentro de contenedores
        run: docker compose up --exit-code-from migrate migrate
      - name: Verificar que el usuario de la API es de solo lectura
        run: |
          set -a; . ./.env; set +a
          docker compose exec -T -e PGPASSWORD="$DATAPULSE_API_DB_PASSWORD" postgres \
            psql -U datapulse_api -d datapulse -tAc "select current_user" | grep -x dp_reader
          if docker compose exec -T -e PGPASSWORD="$DATAPULSE_API_DB_PASSWORD" postgres \
            psql -U datapulse_api -d datapulse -c "delete from ops.pipeline_runs"; then
            echo "ERROR: el usuario de la API pudo borrar datos"; exit 1
          fi
      - name: API simulada en contenedor (contrato + fallos inyectados)
        run: |
          set -a; . ./.env; set +a
          docker compose up -d --wait mock-source
          base="http://127.0.0.1:${MOCK_HOST_PORT}"
          curl -fsS "$base/health" | grep -q '"products":200'
          curl -fsS "$base/products?limit=5&skip=195" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["limit"]==5 and d["total"]==200, d'
          curl -fsS -X PUT -H "X-Mock-Admin-Token: $DATAPULSE_MOCK_ADMIN_TOKEN" -H 'content-type: application/json' \
            "$base/_mock/faults" -d '{"fail_offsets":{"30":1}}' > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/products?skip=30")" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/products?skip=30")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/_mock/state")" = "401"
      - name: Orquestación en contenedores (Prefect + ingesta + dbt + worker)
        run: |
          set -a; . ./.env; set +a
          for src in customers orders; do
            mkdir -p "data/landing/$src" && cp data/samples/$src/* "data/landing/$src/"
          done
          chmod -R a+rX data
          docker compose up -d --wait prefect-server
          docker compose run --rm -T worker python -m datapulse.flows run daily \
            | tee /tmp/flow.json
          grep -q '"state": "COMPLETED"' /tmp/flow.json
          counts=$(docker compose exec -T -e PGPASSWORD="$DATAPULSE_DB_PASSWORD" postgres \
            psql -U "$DATAPULSE_DB_USER" -d datapulse -tAc \
            "select (select count(*) from raw.customers)||','||(select count(*) from raw.orders)||','||(select count(distinct product_id) from raw.products)")
          echo "raw counts: $counts"; test "$counts" = "263,448,197"
          # Los marts de dbt existen y el usuario de la API (solo lectura) puede consultarlos.
          sales=$(docker compose exec -T -e PGPASSWORD="$DATAPULSE_API_DB_PASSWORD" postgres \
            psql -U datapulse_api -d datapulse -tAc "select count(*) from marts.fct_daily_sales")
          echo "fct_daily_sales: $sales"; test "$sales" -gt 0
          docker compose up -d worker
          for i in $(seq 1 30); do
            names=$(curl -fsS -X POST "http://127.0.0.1:${PREFECT_HOST_PORT}/api/deployments/filter" \
              -H 'content-type: application/json' -d '{}' | python3 -c 'import sys,json; print(sorted(d["name"] for d in json.load(sys.stdin)))' || true)
            echo "$names" | grep -q "daily" && break; sleep 2
          done
          echo "despliegues: $names"; echo "$names" | grep -q "products-incremental"
      - name: API de indicadores en contenedor (auth + datos reales)
        run: |
          set -a; . ./.env; set +a
          docker compose up -d --wait api
          base="http://127.0.0.1:${API_HOST_PORT}"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/v1/kpis/summary")" = "401"
          curl -fsS -H "X-API-Key: $CI_API_KEY" "$base/v1/kpis/summary" | tee /tmp/kpis.json
          python3 -c 'import json; d=json.load(open("/tmp/kpis.json")); assert d["orders"] > 0 and float(d["revenue"]) > 0, d'
          curl -fsS -H "X-API-Key: $CI_API_KEY" "$base/v1/quality/summary?layer=post_transform" > /dev/null
          curl -fsS "$base/health/ready" | grep -q '"database":"up"'
      - name: Dashboard en contenedor (salud + datos reales vía API con su propia clave)
        run: |
          set -a; . ./.env; set +a
          docker compose up -d --wait dashboard
          curl -fsS "http://127.0.0.1:${DASHBOARD_HOST_PORT}/_stcore/health" | grep -qx ok
          # El dashboard usa exactamente su configuración de contenedor (URL interna + clave).
          docker compose exec -T dashboard python -c "from datapulse.dashboard.client import ApiClient; c = ApiClient.from_settings(); k = c.kpis(); assert k['orders'] > 0, k; assert c.quality_summary(); assert c.pipeline_runs(); print('dashboard -> API OK:', k['orders'], 'pedidos')"
          # Sin credenciales de base de datos en el contenedor del dashboard.
          test -z "$(docker compose exec -T dashboard env | grep -E '^DATAPULSE_DB_' || true)"
      - name: Imagen ejecuta como usuario no root
        run: test "$(docker run --rm --entrypoint id datapulse-app:local -u)" = "10001"
      - name: Logs ante fallo
        if: failure()
        run: docker compose logs --no-color
      - name: Limpieza
        if: always()
        run: docker compose down -v
