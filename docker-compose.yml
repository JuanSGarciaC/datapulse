# DataPulse - entorno local reproducible.
# Fases 1-6: base de datos, migraciones, API simulada, Prefect (servidor + worker) y API.
# La fase 7 añade el dashboard.
#
# Uso:  cp .env.example .env   (y cambia las contraseñas)
#       docker compose up --build

name: datapulse

x-db-env: &db-env
  DATAPULSE_ENV: ${DATAPULSE_ENV:-dev}
  DATAPULSE_LOG_LEVEL: ${DATAPULSE_LOG_LEVEL:-INFO}
  DATAPULSE_DB_HOST: postgres
  DATAPULSE_DB_PORT: "5432"
  DATAPULSE_DB_NAME: ${DATAPULSE_DB_NAME:-datapulse}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATAPULSE_DB_NAME:-datapulse}
      POSTGRES_USER: ${DATAPULSE_DB_USER:-datapulse_admin}
      POSTGRES_PASSWORD: ${DATAPULSE_DB_PASSWORD:?Define DATAPULSE_DB_PASSWORD en .env}
    # Solo se publica en la interfaz local: la base no queda expuesta a la red.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: datapulse-app:local
    restart: "no"
    environment:
      <<: *db-env
      DATAPULSE_DB_USER: ${DATAPULSE_DB_USER:-datapulse_admin}
      DATAPULSE_DB_PASSWORD: ${DATAPULSE_DB_PASSWORD:?Define DATAPULSE_DB_PASSWORD en .env}
      DATAPULSE_PIPELINE_DB_PASSWORD: ${DATAPULSE_PIPELINE_DB_PASSWORD:?Define DATAPULSE_PIPELINE_DB_PASSWORD}
      DATAPULSE_DBT_DB_PASSWORD: ${DATAPULSE_DBT_DB_PASSWORD:?Define DATAPULSE_DBT_DB_PASSWORD}
      DATAPULSE_API_DB_PASSWORD: ${DATAPULSE_API_DB_PASSWORD:?Define DATAPULSE_API_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  # API externa simulada (contrato de DummyJSON + fallos inyectables). Es una pieza de
  # prueba, no un microservicio de negocio. El catálogo se monta en solo lectura.
  mock-source:
    build: .
    image: datapulse-app:local
    restart: unless-stopped
    command: ["python", "-m", "datapulse.mock_source"]
    environment:
      DATAPULSE_MOCK_HOST: 0.0.0.0
      DATAPULSE_MOCK_PORT: "8081"
      DATAPULSE_MOCK_CATALOG_PATH: /data/samples/products/products_catalog.json
      DATAPULSE_MOCK_ADMIN_TOKEN: ${DATAPULSE_MOCK_ADMIN_TOKEN:?Define DATAPULSE_MOCK_ADMIN_TOKEN}
      DATAPULSE_MOCK_FAULTS: ${DATAPULSE_MOCK_FAULTS:-{}}
    volumes:
      - ./data/samples:/data/samples:ro
    ports:
      - "127.0.0.1:${MOCK_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Orquestador. Su metadata (estados, programación) va en SQLite dentro de su propio
  # volumen: separada de los datos de negocio y sin otro servidor de base de datos.
  prefect-server:
    build: .
    image: datapulse-app:local
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_UI_API_URL: http://localhost:${PREFECT_HOST_PORT:-4200}/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    volumes:
      - prefect:/var/lib/prefect
    ports:
      - "127.0.0.1:${PREFECT_HOST_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Worker: registra los despliegues programados y ejecuta los flujos como datapulse_pipeline.
  worker:
    build: .
    image: datapulse-app:local
    restart: unless-stopped
    command: ["python", "-m", "datapulse.flows", "serve"]
    environment:
      <<: *db-env
      DATAPULSE_DB_USER: datapulse_pipeline
      DATAPULSE_DB_PASSWORD: ${DATAPULSE_PIPELINE_DB_PASSWORD:?Define DATAPULSE_PIPELINE_DB_PASSWORD}
      # dbt usa su propio usuario (dp_transform): el worker no escribe en marts con el del pipeline.
      DATAPULSE_DBT_DB_USER: datapulse_dbt
      DATAPULSE_DBT_DB_PASSWORD: ${DATAPULSE_DBT_DB_PASSWORD:?Define DATAPULSE_DBT_DB_PASSWORD}
      PREFECT_API_URL: http://prefect-server:4200/api
      DATAPULSE_INGEST_PRODUCTS_API_URL: ${DATAPULSE_INGEST_PRODUCTS_API_URL:-http://mock-source:8081}
      DATAPULSE_INGEST_LANDING_DIR: /app/data/landing
      DATAPULSE_FLOW_DAILY_CRON: ${DATAPULSE_FLOW_DAILY_CRON:-0 6 * * *}
    volumes:
      - ./data/landing:/app/data/landing
      - ./data/samples:/app/data/samples:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      prefect-server:
        condition: service_healthy
      mock-source:
        condition: service_healthy

  # API de indicadores: solo lectura (datapulse_api → dp_reader).
  api:
    build: .
    image: datapulse-app:local
    restart: unless-stopped
    command: ["python", "-m", "datapulse.api"]
    environment:
      <<: *db-env
      DATAPULSE_DB_USER: datapulse_api
      DATAPULSE_DB_PASSWORD: ${DATAPULSE_API_DB_PASSWORD:?Define DATAPULSE_API_DB_PASSWORD}
      DATAPULSE_API_HOST: 0.0.0.0
      DATAPULSE_API_PORT: "8000"
      DATAPULSE_API_KEYS: ${DATAPULSE_API_KEYS:?Define DATAPULSE_API_KEYS}
      DATAPULSE_API_ADMIN_KEY: ${DATAPULSE_API_ADMIN_KEY:-}
      DATAPULSE_API_DOCS_ENABLED: ${DATAPULSE_API_DOCS_ENABLED:-true}
      PREFECT_API_URL: http://prefect-server:4200/api
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  prefect:
